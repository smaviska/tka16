<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengumuman</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body {
    font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
    background: #f4f6fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body { background: #0f1420; }
  }
  :root[data-theme="dark"] body { background: #0f1420; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-10">

  <div class="relative w-full max-w-xl">
    <!-- decorative glow -->
    <div class="absolute -top-16 -left-16 w-56 h-56 bg-indigo-300/40 dark:bg-indigo-500/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-16 -right-16 w-56 h-56 bg-sky-300/40 dark:bg-sky-500/20 rounded-full blur-3xl"></div>

    <div class="relative bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border border-white/60 dark:border-slate-700/60 shadow-xl shadow-slate-300/40 dark:shadow-black/40 rounded-3xl p-8 sm:p-10">

      <!-- Icon -->
      <div class="flex justify-center mb-5">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-sky-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </div>
      </div>

      <!-- Title -->
      <p class="text-center text-xs font-semibold tracking-[0.3em] text-indigo-500 dark:text-indigo-400 mb-2">INFORMASI TKA</p>
      <h1 class="text-center text-2xl sm:text-3xl font-extrabold text-slate-800 dark:text-white mb-6">
        PENGUMUMAN
      </h1>

      <div class="h-px w-16 bg-gradient-to-r from-indigo-500 to-sky-500 mx-auto mb-6 rounded-full"></div>

      <!-- Body -->
      <p class="text-slate-600 dark:text-slate-300 text-base sm:text-lg leading-relaxed text-center">
        Hasil koordinasi bersama <span class="font-semibold text-slate-800 dark:text-white">Cabdin</span>, untuk pemetaan dan pengaturan pengawas TKA akan dilakukan oleh
        <span class="font-semibold text-slate-800 dark:text-white">Admin Cabdin</span>.
        Silakan Bp/Ibu operator sekolah untuk memantau perkembangannya di grup WA:
      </p>

      <!-- WA Group Badge -->
      <div class="mt-6 flex justify-center">
        <div class="inline-flex items-center gap-2 bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200 dark:border-emerald-500/30 text-emerald-700 dark:text-emerald-400 font-semibold px-5 py-2.5 rounded-full text-sm sm:text-base">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
            <path d="M12.001 2C6.478 2 2 6.477 2 12c0 1.876.52 3.63 1.42 5.13L2 22l4.995-1.394A9.943 9.943 0 0 0 12 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm0 18.5c-1.72 0-3.318-.494-4.67-1.348l-.335-.21-3.032.846.82-2.988-.219-.31A8.474 8.474 0 0 1 3.5 12c0-4.687 3.813-8.5 8.5-8.5s8.5 3.813 8.5 8.5-3.813 8.5-8.5 8.5z"/>
          </svg>
          UBK Solo
        </div>
      </div>

    </div>

    <p class="text-center text-xs text-slate-400 dark:text-slate-500 mt-6">
      MKKS SMA/MA Kota Surakarta | 2026
    </p>
  </div>

</body>
</html>
