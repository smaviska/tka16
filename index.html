<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f7fc">
    <meta name="description" content="Web Pengaturan Pengawas sedang dalam perbaikan. Kami akan segera hadir kembali.">
    <title>Dalam Perbaikan | Pengaturan Pengawas TKA</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #17324d;
        background: #f3f7fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background:
          radial-gradient(ellipse at 15% 15%, #e2efff 0, transparent 38%),
          radial-gradient(ellipse at 90% 85%, #e8f4f3 0, transparent 34%),
          #f3f7fc;
      }

      main {
        width: min(100%, 620px);
        padding: clamp(32px, 8vw, 64px);
        text-align: center;
        background: rgb(255 255 255 / 92%);
        border: 1px solid #e4ebf3;
        border-radius: 24px;
        box-shadow: 0 24px 70px rgb(33 65 99 / 10%);
      }

      .illustration {
        display: grid;
        width: 104px;
        height: 104px;
        margin: 0 auto 28px;
        place-items: center;
        color: #1769aa;
        background: #eaf3fc;
        border-radius: 50%;
      }

      .illustration svg {
        width: 54px;
        height: 54px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #1769aa;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #17324d;
        font-size: clamp(2rem, 7vw, 3rem);
        line-height: 1.15;
      }

      .message {
        max-width: 420px;
        margin: 18px auto 0;
        color: #52677b;
        font-size: 1.08rem;
        line-height: 1.7;
      }

      .divider {
        width: 48px;
        height: 3px;
        margin: 28px auto;
        background: #b8d6f2;
        border: 0;
        border-radius: 999px;
      }

      .thanks {
        margin: 0;
        color: #718396;
        font-size: 0.92rem;
      }

      @media (prefers-reduced-motion: no-preference) {
        .illustration svg {
          animation: gentle-turn 8s linear infinite;
          transform-origin: center;
        }

        @keyframes gentle-turn {
          to {
            transform: rotate(360deg);
          }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="illustration" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M25.5 12.5 28 7h8l2.5 5.5 5.1 2.1 5.5-2.4 5.7 5.7-2.4 5.5 2.1 5.1L60 31v8l-5.5 2.5-2.1 5.1 2.4 5.5-5.7 5.7-5.5-2.4-5.1 2.1L36 63h-8l-2.5-5.5-5.1-2.1-5.5 2.4-5.7-5.7 2.4-5.5-2.1-5.1L4 39v-8l5.5-2.5 2.1-5.1-2.4-5.5 5.7-5.7 5.5 2.4 5.1-2.1Z" fill="currentColor" opacity=".18"/>
          <path d="M25.5 12.5 28 7h8l2.5 5.5 5.1 2.1 5.5-2.4 5.7 5.7-2.4 5.5 2.1 5.1L60 31v8l-5.5 2.5-2.1 5.1 2.4 5.5-5.7 5.7-5.5-2.4-5.1 2.1L36 63h-8l-2.5-5.5-5.1-2.1-5.5 2.4-5.7-5.7 2.4-5.5-2.1-5.1L4 39v-8l5.5-2.5 2.1-5.1-2.4-5.5 5.7-5.7 5.5 2.4 5.1-2.1Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="32" cy="35" r="10" stroke="currentColor" stroke-width="3"/>
          <circle cx="32" cy="35" r="3.5" fill="currentColor"/>
        </svg>
      </div>
      <p class="eyebrow">Pengaturan Pengawas TKA</p>
      <h1>Sedang Dalam Perbaikan</h1>
      <p class="message">Web Pengaturan Pengawas TKA sedang dalam perbaikan. Kami akan segera hadir kembali.</p>
      <hr class="divider">
      <p class="thanks">Terima kasih atas pengertian dan kesabaran Anda.</p>
    </main>
  </body>
</html>
